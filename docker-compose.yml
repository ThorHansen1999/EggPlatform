services:
  app:
    build:
      context: .
      # Use dev stage locally for hot reload + debug; change to php-base for production image
      target: dev
    image: eggplatform-app:latest
    container_name: eggplatform-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: egg_platform
      DB_USERNAME: exception_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: eggplatform-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: eggplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: egg_platform
      POSTGRES_USER: exception_user
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: EggPlatform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # Horizon queue management dashboard & workers
  horizon:
    image: eggplatform-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: egg_platform
      DB_USERNAME: exception_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "horizon"]
    depends_on:
      - app
      - postgres
      - redis
    volumes:
      - ./:/var/www/html

  # Simple scheduler loop (consider using cron in separate minimal image for production)
  scheduler:
    image: eggplatform-app:latest
    container_name: eggplatform-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: egg_platform
      DB_USERNAME: exception_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      - app
      - postgres
      - redis
    volumes:
      - ./:/var/www/html

  # Optional database admin UI (enable with --profile tools)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: eggplatform-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:

# Notes:
#  - Horizon replaces legacy queue-worker; scale via: docker compose up -d --scale horizon=3
#  - Healthcheck directives removed intentionally; rely on external monitoring or docker restart policies.
#  - For production: build with target=prod (see Dockerfile prod stage), remove bind mounts, inject secrets securely.
#  - Consider adding explicit networks if integrating with other stacks.
